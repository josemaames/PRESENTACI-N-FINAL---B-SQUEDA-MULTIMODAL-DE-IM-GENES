<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Imágenes CLIP</title>
<style>
  :root {
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --fg:#182033; --muted:#667089;
    --line:#dde2ee; --accent:#4f6df5; --accent-2:#8b5cf6; --accent-fg:#fff; --shadow:0 6px 24px rgba(30,40,80,.08);
    --err:#c0392b; --rec:#e5484d;
  }
  :root[data-theme="dark"] {
    --bg:#0f1219; --surface:#181c27; --surface-2:#212736; --fg:#e8ebf4; --muted:#8e98b1;
    --line:#2c3347; --accent:#6d86ff; --accent-2:#a78bfa; --shadow:0 6px 24px rgba(0,0,0,.4);
    --err:#ff7b6e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); transition:background .25s,color .25s; }
  main { max-width:980px; margin:0 auto; padding:24px 16px 56px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
  .head-btns { display:flex; gap:8px; }
  h1 { font-size:1.35rem; margin:0; letter-spacing:-.01em; }
  h1 span { background:linear-gradient(90deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:.85rem; margin-top:2px; }
  button { font:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .icon-btn { width:40px; height:40px; flex:none; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--fg); display:grid; place-items:center; box-shadow:var(--shadow); transition:transform .15s,border-color .15s; font-weight:700; }
  .icon-btn:hover { transform:translateY(-1px); border-color:var(--accent); }
  #theme:hover { transform:translateY(-1px) rotate(12deg); }

  .seg { display:inline-flex; background:var(--surface-2); border-radius:999px; padding:4px; gap:2px; margin-bottom:16px; }
  .seg button { border:0; background:transparent; color:var(--muted); padding:8px 18px; border-radius:999px; font-weight:600; font-size:.9rem; transition:all .2s; }
  .seg button.active { background:var(--surface); color:var(--fg); box-shadow:0 2px 8px rgba(0,0,0,.12); }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar input[type=text] { flex:1; min-width:200px; padding:12px 16px; border:1px solid var(--line); border-radius:999px; background:var(--surface-2); color:var(--fg); font:inherit; }
  .btn { border:0; padding:12px 22px; border-radius:999px; font-weight:600; color:var(--accent-fg); background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 4px 14px rgba(79,109,245,.35); transition:transform .15s,box-shadow .15s,opacity .15s; display:inline-flex; gap:8px; align-items:center; justify-content:center; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(79,109,245,.45); }
  .btn:active { transform:translateY(0); }
  .btn:disabled { opacity:.6; cursor:wait; }
  .btn.ghost { background:var(--surface-2); color:var(--fg); box-shadow:none; border:1px solid var(--line); }
  .btn.ghost:hover { border-color:var(--accent); box-shadow:none; }
  select { padding:10px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--fg); font:inherit; }

  .mic { width:44px; height:44px; box-shadow:none; background:var(--surface-2); }
  .mic.rec { background:var(--rec); color:#fff; border-color:var(--rec); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(229,72,77,.5); } 100% { box-shadow:0 0 0 14px rgba(229,72,77,0); } }
  #mlang { padding:10px 8px; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
  .chips .lbl { font-size:.78rem; color:var(--muted); margin-right:2px; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--muted); padding:5px 12px; border-radius:999px; font-size:.8rem; transition:all .15s; }
  .chip:hover { color:var(--fg); border-color:var(--accent); }
  .chip.clear { border-style:dashed; }

  .drop { flex:1; min-width:220px; border:2px dashed var(--line); border-radius:14px; padding:16px; text-align:center; color:var(--muted); background:var(--surface-2); cursor:pointer; transition:all .2s; }
  .drop.over, .drop:hover { border-color:var(--accent); color:var(--fg); }
  .drop img { max-height:110px; border-radius:10px; display:block; margin:0 auto 6px; }
  .hidden { display:none !important; }

  .status { min-height:24px; margin:16px 2px 8px; font-size:.88rem; color:var(--muted); display:flex; align-items:center; gap:10px; }
  .status.err { color:var(--err); }
  .spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:s .7s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); animation:in .35s both; }
  @keyframes in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .card .img { position:relative; aspect-ratio:1; overflow:hidden; cursor:zoom-in; background:var(--surface-2); }
  .card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s; }
  .card .img:hover img { transform:scale(1.05); }
  .rank { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.6); color:#fff; font-size:.75rem; font-weight:700; padding:3px 9px; border-radius:999px; }
  .meta { padding:10px 12px 12px; }
  .score { display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin-bottom:6px; }
  .track { height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .acts { display:flex; gap:6px; margin-top:10px; }
  .similar { flex:1; border:1px solid var(--line); background:transparent; color:var(--fg); padding:7px; border-radius:999px; font-size:.8rem; font-weight:600; transition:all .15s; }
  .similar:hover { border-color:var(--accent); color:var(--accent); }
  .ic { width:34px; height:34px; flex:none; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--muted); display:grid; place-items:center; transition:all .15s; text-decoration:none; }
  .ic:hover { border-color:var(--accent); color:var(--accent); }

  .sk .sk-img, .sk-line { background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%); background-size:200% 100%; animation:sh 1.2s infinite; }
  .sk .sk-img { aspect-ratio:1; }
  .sk-line { height:10px; border-radius:99px; margin:8px 0; }
  .sk-line.short { width:55%; }
  @keyframes sh { to { background-position:-200% 0; } }

  .hint { margin-top:28px; font-size:.78rem; color:var(--muted); text-align:center; }
  kbd { background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:.75rem; }

  .lightbox, .modal { position:fixed; inset:0; background:rgba(0,0,0,.85); display:grid; place-items:center; z-index:10; padding:20px; }
  .lightbox { cursor:zoom-out; }
  .lightbox img { max-width:100%; max-height:88vh; border-radius:12px; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.18); color:#fff; font-size:1.6rem; line-height:1; }
  .nav:hover { background:rgba(255,255,255,.3); }
  .nav.prev { left:12px; } .nav.next { right:12px; }
  .modal .box { background:var(--surface); color:var(--fg); border-radius:20px; max-width:560px; width:100%; max-height:90vh; overflow:auto; padding:22px; position:relative; }
  .modal h2 { margin:0 0 12px; font-size:1.2rem; }
  .modal ol { padding-left:20px; margin:12px 0 0; line-height:1.5; }
  .modal li { margin-bottom:8px; }
  .modal .close { position:absolute; top:12px; right:12px; width:34px; height:34px; box-shadow:none; }
  .space { width:100%; height:auto; background:var(--surface-2); border-radius:14px; }
  .dot { fill:var(--muted); opacity:.55; }
  .near { fill:var(--accent-2); opacity:1; }
  .qdot { fill:var(--accent); animation:pop 1.6s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
  .link { stroke:var(--accent); stroke-width:1.5; stroke-dasharray:4 4; animation:dash 1.2s linear infinite; }
  @keyframes pop { 50% { transform:scale(1.5); } }
  @keyframes dash { to { stroke-dashoffset:-16; } }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.88rem; opacity:0; pointer-events:none; transition:all .25s; z-index:20; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:640px) {
    .grid { grid-template-columns:repeat(2,1fr); gap:10px; }
    header { align-items:flex-start; }
    .bar input[type=text], .drop { flex:1 1 100%; }
    .bar label.sub { display:none; }
    .bar select { flex:0 0 auto; }
    .bar .btn { flex:1; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1><span>Buscador multimodal</span> de imágenes</h1>
      <div class="sub" id="info">CLIP · texto en español e inglés · imagen a imagen</div>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="help" aria-label="¿Cómo funciona?" title="¿Cómo funciona?">?</button>
      <button class="icon-btn" id="theme" aria-label="Cambiar tema" title="Cambiar tema"></button>
    </div>
  </header>

  <div class="seg" role="tablist">
    <button id="tab-text" class="active" role="tab">Texto</button>
    <button id="tab-image" role="tab">Imagen</button>
  </div>

  <section class="panel">
    <div class="bar" id="bar-text">
      <input type="text" id="q" placeholder="Escribe en español o inglés… (a sleeping cat / un gato durmiendo)" autocomplete="off">
      <button class="icon-btn mic" id="mic" aria-label="Buscar con la voz" title="Buscar con la voz"></button>
      <select id="mlang" title="Idioma de la voz"><option value="es-PE">ES</option><option value="en-US">EN</option></select>
      <label class="sub" for="k-text">Resultados</label>
      <select class="k" id="k-text"><option>3</option><option selected>6</option><option>9</option><option>12</option></select>
      <button class="btn" id="go-text">Search</button>
    </div>
    <div class="chips" id="history"></div>
    <div class="chips" id="chips">
      <button class="chip" data-q="a sleeping cat">a sleeping cat</button>
      <button class="chip" data-q="un gato durmiendo">un gato durmiendo</button>
      <button class="chip" data-q="a dog running on grass">a dog running on grass</button>
      <button class="chip" data-q="un perro corriendo en el pasto">un perro corriendo en el pasto</button>
      <button class="chip" data-q="un cachorro">un cachorro</button>
      <button class="chip" data-q="a black cat">a black cat</button>
    </div>

    <div class="bar hidden" id="bar-image">
      <div class="drop" id="drop">
        <img id="preview" class="hidden" alt="">
        <span id="drop-text">Arrastra, pega (Ctrl+V) o haz clic para subir una imagen</span>
        <input type="file" id="file" accept="image/*" class="hidden">
      </div>
      <input type="file" id="cam-file" accept="image/*" capture="environment" class="hidden">
      <button class="btn ghost" id="cam">Tomar foto</button>
      <select class="k" id="k-image"><option>3</option><option selected>6</option><option>9</option><option>12</option></select>
      <button class="btn" id="go-image">Search</button>
    </div>
  </section>

  <div class="status" id="status"></div>
  <div class="grid" id="results"></div>
  <p class="hint"><kbd>/</kbd> buscar · <kbd>←</kbd> <kbd>→</kbd> recorrer imágenes · <kbd>Ctrl</kbd>+<kbd>V</kbd> pegar imagen · <kbd>?</kbd> ayuda · <kbd>Esc</kbd> cerrar</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const MIC = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>';
const ICON_COPY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
const ICON_DL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>';

let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800);
}

// ---- Tema claro / noche (recuerda la elección; si no hay, sigue al sistema) ----
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").innerHTML = t === "dark" ? SUN : MOON;
  try { localStorage.setItem("theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("mic").innerHTML = MIC;

// ---- Pestañas ----
let current = "text";
function mode(m) {
  current = m;
  const t = m === "text";
  $("tab-text").classList.toggle("active", t); $("tab-image").classList.toggle("active", !t);
  $("bar-text").classList.toggle("hidden", !t); $("chips").classList.toggle("hidden", !t);
  $("history").classList.toggle("hidden", !t || !loadHist().length);
  $("bar-image").classList.toggle("hidden", t);
  $("results").innerHTML = ""; setStatus("");
}
$("tab-text").onclick = () => mode("text");
$("tab-image").onclick = () => mode("image");

function setStatus(msg, kind) {
  const s = $("status");
  s.className = "status" + (kind === "err" ? " err" : "");
  s.innerHTML = kind === "load" ? '<span class="spin"></span>' : "";
  s.append(msg);
}

// ---- Historial de búsquedas (se guarda en este navegador) ----
function loadHist() { try { return JSON.parse(localStorage.getItem("hist") || "[]"); } catch (e) { return []; } }
function saveHist(q) {
  let h = loadHist().filter(x => x !== q); h.unshift(q); h = h.slice(0, 8);
  try { localStorage.setItem("hist", JSON.stringify(h)); } catch (e) {}
  renderHist();
}
function renderHist() {
  const h = loadHist(), c = $("history");
  c.innerHTML = "";
  c.classList.toggle("hidden", !h.length || current !== "text");
  if (!h.length) return;
  const l = document.createElement("span"); l.className = "lbl"; l.textContent = "Recientes:"; c.append(l);
  h.forEach(q => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = q;
    b.onclick = () => { $("q").value = q; doText(); };
    c.append(b);
  });
  const x = document.createElement("button"); x.className = "chip clear"; x.textContent = "Borrar";
  x.onclick = () => { try { localStorage.removeItem("hist"); } catch (e) {} renderHist(); };
  c.append(x);
}
renderHist();

// ---- Esqueletos de carga ----
function showSkeleton(n) {
  $("results").innerHTML = "";
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div"); c.className = "card sk";
    c.innerHTML = '<div class="sk-img"></div><div class="meta"><div class="sk-line"></div><div class="sk-line short"></div></div>';
    $("results").append(c);
  }
}

// ---- Resultados ----
let gallery = [];
function render(data) {
  $("results").innerHTML = "";
  gallery = data.results.map(r => r.url);
  data.results.forEach((r, i) => {
    const pct = Math.max(0, Math.min(100, Math.round(r.score * 100)));
    const c = document.createElement("div");
    c.className = "card"; c.style.animationDelay = i * 40 + "ms";
    c.innerHTML = `<div class="img"><img loading="lazy" alt=""><span class="rank">#${i + 1}</span></div>
      <div class="meta"><div class="score"><span>Similitud</span><b>${r.score.toFixed(3)}</b></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="acts"><button class="similar">Ver similares</button>
      <button class="ic copy" title="Copiar enlace" aria-label="Copiar enlace">${ICON_COPY}</button>
      <a class="ic dl" title="Descargar" aria-label="Descargar">${ICON_DL}</a></div></div>`;
    c.querySelector("img").src = r.url;
    c.querySelector(".img").onclick = () => openLB(i);
    c.querySelector(".similar").onclick = () => similar(r.name);
    c.querySelector(".copy").onclick = async () => {
      const full = location.origin + r.url;
      try { await navigator.clipboard.writeText(full); toast("Enlace copiado"); }
      catch (e) { prompt("Copia este enlace:", full); }
    };
    const dl = c.querySelector(".dl"); dl.href = r.url; dl.download = r.name.split("/").pop();
    $("results").append(c);
  });
  setStatus(`${data.results.length} resultados en ${data.ms} ms`);
}
async function run(promise, btn) {
  setStatus("Buscando…", "load"); btn.disabled = true;
  try {
    const r = await promise, data = await r.json();
    if (data.error) { $("results").innerHTML = ""; setStatus(data.error, "err"); } else render(data);
  } catch (e) { $("results").innerHTML = ""; setStatus("Error: " + e, "err"); }
  btn.disabled = false;
}
const K = () => ($(current === "text" ? "k-text" : "k-image")).value;

function doText() {
  const q = $("q").value.trim();
  if (!q) return setStatus("Escribe una consulta.", "err");
  saveHist(q); showSkeleton(+K());
  run(fetch("/api/search/text?k=" + K() + "&q=" + encodeURIComponent(q)), $("go-text"));
}
function similar(name) {
  window.scrollTo({ top: 0, behavior: "smooth" });
  showSkeleton(+K());
  run(fetch("/api/search/similar?k=" + K() + "&name=" + encodeURIComponent(name)), current === "text" ? $("go-text") : $("go-image"));
}
$("go-text").onclick = doText;
$("q").onkeydown = e => { if (e.key === "Enter") doText(); };
document.querySelectorAll("#chips .chip").forEach(b => b.onclick = () => { $("q").value = b.dataset.q; doText(); });

// ---- Voz (Web Speech API; depende del navegador) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR) { $("mic").classList.add("hidden"); $("mlang").classList.add("hidden"); }
else {
  $("mic").onclick = () => {
    if (listening) { rec.stop(); return; }
    rec = new SR(); rec.lang = $("mlang").value; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onstart = () => { listening = true; $("mic").classList.add("rec"); setStatus("Escuchando… habla ahora", "load"); };
    rec.onresult = e => {
      let t = ""; for (const r of e.results) t += r[0].transcript;
      $("q").value = t;
      if (e.results[e.results.length - 1].isFinal) doText();
    };
    rec.onerror = e => setStatus("No se pudo usar el micrófono (" + e.error + ")", "err");
    rec.onend = () => {
      listening = false; $("mic").classList.remove("rec");
      if ($("status").textContent.startsWith("Escuchando")) setStatus("");
    };
    rec.start();
  };
}

// ---- Subida de imagen: clic, arrastrar, pegar o tomar foto ----
let chosen = null;
function pick(f) {
  if (!f || !f.type.startsWith("image/")) return setStatus("Elige un archivo de imagen.", "err");
  chosen = f;
  $("preview").src = URL.createObjectURL(f); $("preview").classList.remove("hidden");
  $("drop-text").textContent = f.name || "Imagen pegada";
}
$("drop").onclick = () => $("file").click();
$("file").onchange = () => pick($("file").files[0]);
$("cam").onclick = () => $("cam-file").click();
$("cam-file").onchange = () => { pick($("cam-file").files[0]); if (chosen) $("go-image").click(); };
["dragenter", "dragover"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));
$("go-image").onclick = () => {
  if (!chosen) return setStatus("Sube una imagen primero.", "err");
  const fd = new FormData(); fd.append("file", chosen); fd.append("k", K());
  showSkeleton(+K());
  run(fetch("/api/search/image", { method: "POST", body: fd }), $("go-image"));
};
document.addEventListener("paste", e => {
  const f = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0];
  if (f && f.type.startsWith("image/")) {
    e.preventDefault();
    if (current !== "image") mode("image");
    pick(f); $("go-image").click(); toast("Imagen pegada");
  }
});

// ---- Imagen ampliada con navegación ----
let gi = 0;
function openLB(i) {
  gi = i;
  let d = document.querySelector(".lightbox");
  if (!d) {
    d = document.createElement("div"); d.className = "lightbox";
    d.innerHTML = '<button class="nav prev" aria-label="Anterior">‹</button><img alt=""><button class="nav next" aria-label="Siguiente">›</button>';
    d.onclick = e => { if (e.target === d || e.target.tagName === "IMG") d.remove(); };
    d.querySelector(".prev").onclick = e => { e.stopPropagation(); stepLB(-1); };
    d.querySelector(".next").onclick = e => { e.stopPropagation(); stepLB(1); };
    document.body.append(d);
  }
  d.querySelector("img").src = gallery[gi];
}
function stepLB(n) { if (gallery.length) openLB((gi + n + gallery.length) % gallery.length); }

// ---- Modal "¿Cómo funciona?" ----
let totalImgs = null;
function openHelp() {
  if (document.querySelector(".modal")) return;
  const n = totalImgs ? totalImgs.toLocaleString() : "miles de";
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><button class="icon-btn close" aria-label="Cerrar">✕</button>
    <h2>¿Cómo funciona?</h2>
    <svg class="space" viewBox="0 0 400 190" role="img" aria-label="Espacio de vectores: la consulta se une a los puntos más cercanos">
      <circle class="dot" cx="40" cy="40" r="5"/><circle class="dot" cx="95" cy="150" r="5"/><circle class="dot" cx="150" cy="60" r="5"/>
      <circle class="dot" cx="330" cy="40" r="5"/><circle class="dot" cx="360" cy="150" r="5"/><circle class="dot" cx="280" cy="165" r="5"/>
      <circle class="dot" cx="60" cy="100" r="5"/><circle class="dot" cx="230" cy="30" r="5"/>
      <line class="link" x1="215" y1="105" x2="250" y2="80"/><line class="link" x1="215" y1="105" x2="195" y2="135"/><line class="link" x1="215" y1="105" x2="255" y2="125"/>
      <circle class="near" cx="250" cy="80" r="6"/><circle class="near" cx="195" cy="135" r="6"/><circle class="near" cx="255" cy="125" r="6"/>
      <circle class="qdot" cx="215" cy="105" r="8"/>
    </svg>
    <ol>
      <li>CLIP convierte cada una de las <b>${n} imágenes</b> en un vector de 512 números. Eso se hace una sola vez.</li>
      <li>Tu texto (en español o inglés) o tu imagen se convierte en un vector en <b>el mismo espacio</b>.</li>
      <li>Se buscan los vectores <b>más cercanos</b> (similitud coseno) y esas son las imágenes que ves.</li>
      <li>Por eso encuentra por <b>significado</b>, no por píxeles ni por nombres de archivo.</li>
    </ol></div>`;
  m.onclick = e => { if (e.target === m || e.target.closest(".close")) m.remove(); };
  document.body.append(m);
}
$("help").onclick = openHelp;

// ---- Atajos de teclado ----
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { document.querySelector(".lightbox")?.remove(); document.querySelector(".modal")?.remove(); return; }
  if (document.querySelector(".lightbox")) {
    if (e.key === "ArrowLeft") stepLB(-1); else if (e.key === "ArrowRight") stepLB(1);
    return;
  }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); if (current !== "text") mode("text"); $("q").focus(); }
  else if (e.key === "?") openHelp();
});

// ---- Info del índice ----
fetch("/api/info").then(r => r.json()).then(i => {
  if (i.images) { totalImgs = i.images; $("info").textContent = `CLIP · ${i.images.toLocaleString()} imágenes indexadas · texto en español e inglés`; }
}).catch(() => {});
</script>
</body>
</html>
