<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Imágenes CLIP</title>
<style>
  :root {
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --fg:#182033; --muted:#667089;
    --line:#dde2ee; --accent:#4f6df5; --accent-2:#8b5cf6; --accent-fg:#fff; --shadow:0 6px 24px rgba(30,40,80,.08);
    --err:#c0392b;
  }
  :root[data-theme="dark"] {
    --bg:#0f1219; --surface:#181c27; --surface-2:#212736; --fg:#e8ebf4; --muted:#8e98b1;
    --line:#2c3347; --accent:#6d86ff; --accent-2:#a78bfa; --shadow:0 6px 24px rgba(0,0,0,.4);
    --err:#ff7b6e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); transition:background .25s,color .25s; }
  main { max-width:980px; margin:0 auto; padding:24px 16px 56px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
  h1 { font-size:1.35rem; margin:0; letter-spacing:-.01em; }
  h1 span { background:linear-gradient(90deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); font-size:.85rem; margin-top:2px; }
  button { font:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .icon-btn { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--fg); display:grid; place-items:center; box-shadow:var(--shadow); transition:transform .15s; }
  .icon-btn:hover { transform:translateY(-1px) rotate(12deg); }

  .seg { display:inline-flex; background:var(--surface-2); border-radius:999px; padding:4px; gap:2px; margin-bottom:16px; }
  .seg button { border:0; background:transparent; color:var(--muted); padding:8px 18px; border-radius:999px; font-weight:600; font-size:.9rem; transition:all .2s; }
  .seg button.active { background:var(--surface); color:var(--fg); box-shadow:0 2px 8px rgba(0,0,0,.12); }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar input[type=text] { flex:1; min-width:200px; padding:12px 16px; border:1px solid var(--line); border-radius:999px; background:var(--surface-2); color:var(--fg); font:inherit; }
  .btn { border:0; padding:12px 22px; border-radius:999px; font-weight:600; color:var(--accent-fg); background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 4px 14px rgba(79,109,245,.35); transition:transform .15s,box-shadow .15s,opacity .15s; display:inline-flex; gap:8px; align-items:center; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(79,109,245,.45); }
  .btn:active { transform:translateY(0); }
  .btn:disabled { opacity:.6; cursor:wait; }
  select { padding:10px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); color:var(--fg); font:inherit; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--muted); padding:5px 12px; border-radius:999px; font-size:.8rem; transition:all .15s; }
  .chip:hover { color:var(--fg); border-color:var(--accent); }

  .drop { flex:1; min-width:220px; border:2px dashed var(--line); border-radius:14px; padding:16px; text-align:center; color:var(--muted); background:var(--surface-2); cursor:pointer; transition:all .2s; }
  .drop.over, .drop:hover { border-color:var(--accent); color:var(--fg); }
  .drop img { max-height:110px; border-radius:10px; display:block; margin:0 auto 6px; }
  .hidden { display:none !important; }

  .status { min-height:24px; margin:16px 2px 8px; font-size:.88rem; color:var(--muted); display:flex; align-items:center; gap:10px; }
  .status.err { color:var(--err); }
  .spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:s .7s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); animation:in .35s both; }
  @keyframes in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .card .img { position:relative; aspect-ratio:1; overflow:hidden; cursor:zoom-in; background:var(--surface-2); }
  .card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s; }
  .card .img:hover img { transform:scale(1.05); }
  .rank { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.6); color:#fff; font-size:.75rem; font-weight:700; padding:3px 9px; border-radius:999px; }
  .meta { padding:10px 12px 12px; }
  .score { display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin-bottom:6px; }
  .track { height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .similar { margin-top:10px; width:100%; border:1px solid var(--line); background:transparent; color:var(--fg); padding:7px; border-radius:999px; font-size:.8rem; font-weight:600; transition:all .15s; }
  .similar:hover { border-color:var(--accent); color:var(--accent); }

  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:grid; place-items:center; z-index:10; padding:20px; cursor:zoom-out; }
  .lightbox img { max-width:100%; max-height:92vh; border-radius:12px; }
  @media (max-width:640px) { .grid { grid-template-columns:repeat(2,1fr); gap:10px; } header { align-items:flex-start; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1><span>Buscador multimodal</span> de imágenes</h1>
      <div class="sub" id="info">CLIP · texto en español e inglés · imagen a imagen</div>
    </div>
    <button class="icon-btn" id="theme" aria-label="Cambiar tema" title="Cambiar tema"></button>
  </header>

  <div class="seg" role="tablist">
    <button id="tab-text" class="active" role="tab">Texto</button>
    <button id="tab-image" role="tab">Imagen</button>
  </div>

  <section class="panel">
    <div class="bar" id="bar-text">
      <input type="text" id="q" placeholder="Escribe en español o inglés… (a sleeping cat / un gato durmiendo)" autocomplete="off">
      <label class="sub" for="k-text">Resultados</label>
      <select class="k" id="k-text"><option>3</option><option selected>6</option><option>9</option><option>12</option></select>
      <button class="btn" id="go-text">Search</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-q="a sleeping cat">a sleeping cat</button>
      <button class="chip" data-q="un gato durmiendo">un gato durmiendo</button>
      <button class="chip" data-q="a dog running on grass">a dog running on grass</button>
      <button class="chip" data-q="un perro corriendo en el pasto">un perro corriendo en el pasto</button>
      <button class="chip" data-q="un cachorro">un cachorro</button>
      <button class="chip" data-q="a black cat">a black cat</button>
    </div>

    <div class="bar hidden" id="bar-image">
      <div class="drop" id="drop">
        <img id="preview" class="hidden" alt="">
        <span id="drop-text">Arrastra una imagen aquí o haz clic para subirla</span>
        <input type="file" id="file" accept="image/*" class="hidden">
      </div>
      <select class="k" id="k-image"><option>3</option><option selected>6</option><option>9</option><option>12</option></select>
      <button class="btn" id="go-image">Search</button>
    </div>
  </section>

  <div class="status" id="status"></div>
  <div class="grid" id="results"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

// ---- Tema claro / noche (recuerda la elección; si no hay, sigue al sistema) ----
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").innerHTML = t === "dark" ? SUN : MOON;
  try { localStorage.setItem("theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

// ---- Pestañas ----
let current = "text";
function mode(m) {
  current = m;
  const t = m === "text";
  $("tab-text").classList.toggle("active", t); $("tab-image").classList.toggle("active", !t);
  $("bar-text").classList.toggle("hidden", !t); $("chips").classList.toggle("hidden", !t);
  $("bar-image").classList.toggle("hidden", t);
  $("results").innerHTML = ""; setStatus("");
}
$("tab-text").onclick = () => mode("text");
$("tab-image").onclick = () => mode("image");

function setStatus(msg, kind) {
  const s = $("status");
  s.className = "status" + (kind === "err" ? " err" : "");
  s.innerHTML = kind === "load" ? '<span class="spin"></span>' : "";
  s.append(msg);
}

// ---- Resultados ----
function render(data) {
  $("results").innerHTML = "";
  data.results.forEach((r, i) => {
    const pct = Math.max(0, Math.min(100, Math.round(r.score * 100)));
    const c = document.createElement("div");
    c.className = "card"; c.style.animationDelay = i * 40 + "ms";
    c.innerHTML = `<div class="img"><img loading="lazy" alt=""><span class="rank">#${i + 1}</span></div>
      <div class="meta"><div class="score"><span>Similitud</span><b>${r.score.toFixed(3)}</b></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <button class="similar">Ver similares</button></div>`;
    c.querySelector("img").src = r.url;
    c.querySelector(".img").onclick = () => lightbox(r.url);
    c.querySelector(".similar").onclick = () => similar(r.name);
    $("results").append(c);
  });
  setStatus(`${data.results.length} resultados en ${data.ms} ms`);
}
async function run(promise, btn) {
  setStatus("Buscando…", "load"); btn.disabled = true;
  try {
    const r = await promise, data = await r.json();
    if (data.error) { $("results").innerHTML = ""; setStatus(data.error, "err"); } else render(data);
  } catch (e) { setStatus("Error: " + e, "err"); }
  btn.disabled = false;
}
const K = () => ($(current === "text" ? "k-text" : "k-image")).value;

function doText() {
  const q = $("q").value.trim();
  if (!q) return setStatus("Escribe una consulta.", "err");
  run(fetch("/api/search/text?k=" + K() + "&q=" + encodeURIComponent(q)), $("go-text"));
}
function similar(name) {
  window.scrollTo({ top: 0, behavior: "smooth" });
  run(fetch("/api/search/similar?k=" + K() + "&name=" + encodeURIComponent(name)), current === "text" ? $("go-text") : $("go-image"));
}
$("go-text").onclick = doText;
$("q").onkeydown = e => { if (e.key === "Enter") doText(); };
document.querySelectorAll(".chip").forEach(b => b.onclick = () => { $("q").value = b.dataset.q; doText(); });

// ---- Subida de imagen (clic o arrastrar y soltar) ----
let chosen = null;
function pick(f) {
  if (!f || !f.type.startsWith("image/")) return setStatus("Elige un archivo de imagen.", "err");
  chosen = f;
  $("preview").src = URL.createObjectURL(f); $("preview").classList.remove("hidden");
  $("drop-text").textContent = f.name;
}
$("drop").onclick = () => $("file").click();
$("file").onchange = () => pick($("file").files[0]);
["dragenter", "dragover"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));
$("go-image").onclick = () => {
  if (!chosen) return setStatus("Sube una imagen primero.", "err");
  const fd = new FormData(); fd.append("file", chosen); fd.append("k", K());
  run(fetch("/api/search/image", { method: "POST", body: fd }), $("go-image"));
};

// ---- Lightbox ----
function lightbox(src) {
  const d = document.createElement("div"); d.className = "lightbox";
  d.innerHTML = "<img alt=''>"; d.firstChild.src = src;
  d.onclick = () => d.remove(); document.body.append(d);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelector(".lightbox")?.remove(); });

// ---- Info del índice ----
fetch("/api/info").then(r => r.json()).then(i => {
  if (i.images) $("info").textContent = `CLIP · ${i.images.toLocaleString()} imágenes indexadas · texto en español e inglés`;
}).catch(() => {});
</script>
</body>
</html>
